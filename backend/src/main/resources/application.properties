spring.application.name=AI_ResumeRAG_BE

server.port=8080
server.servlet.context-path = /api

# ==============================
# PostgreSQL Database
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5433/ai_resume_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================
# JWT
# ==============================
jwt.secret=dhakjhgGJHHBhwhC=JBJhe+/kjsbfkjsgvewhgTFHGCGEv
jwt.expiration=86400000

# ==============================
# Multipart File Upload
# ==============================
# A bulk batch is one request: up to 500 resumes of 10 MB each is capped by pipeline.upload.* below.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=700MB
# Tomcat caps the number of multipart parts (default 10), which would reject any real batch.
server.tomcat.max-part-count=600

# ==============================
# Resume pipeline (bulk upload -> queue -> staged AI processing)
# Every value can be overridden by an environment variable, e.g. PIPELINE_WORKER_CONCURRENCY=2
# ==============================
pipeline.upload.max-files=500
pipeline.upload.max-file-size=10MB
pipeline.upload.max-batch-size=600MB
pipeline.worker.enabled=true
pipeline.worker.concurrency=2
pipeline.worker.poll-interval=2s
pipeline.worker.lease=15m
pipeline.retry.max-attempts=3
pipeline.retry.base-delay=10s
pipeline.retry.max-delay=1m
# Shared secret for the AI service's pipeline endpoints (its PIPELINE_API_KEY). Leave empty for local development.
pipeline.ai.api-key=${PIPELINE_AI_API_KEY:}
# Bump when scoring or prompts change so cached scores/summaries are recomputed.
pipeline.analysis-version=2.1
pipeline.model-tag=${LLM_MODEL:qwen3:4b}


spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

