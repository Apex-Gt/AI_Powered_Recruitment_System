ai-service.api-key=${AI_SERVICE_API_KEY:dev-ai-service-key}
inngest.signing-key=
inngest.base-url=http://localhost:8288
inngest.dev-mode=true
# Auth cookie (set secure=true when served over HTTPS)
app.cookie.secure=false
app.cookie.same-site=Lax

# ==============================
# City autocomplete (Geoapify) - set GEOAPIFY_API_KEY in the environment / .env
# ==============================
# backend/.env is not loaded by Spring on its own, so import it (run the backend from the backend/ folder)
spring.config.import=optional:file:.env[.properties]
geoapify.api-key=${GEOAPIFY_API_KEY:}
