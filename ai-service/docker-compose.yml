version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: ai-service-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai-service-network

  inngest:
    image: inngest/inngest:latest
    container_name: ai-service-inngest
    ports:
      - "8288:8288"
    environment:
      - INNGEST_DEV=true
      - INNGEST_LOG_LEVEL=info
    volumes:
      - inngest_data:/data
    networks:
      - ai-service-network

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_FOUNDATION_MODEL=Qwen3-Embedding-8B
      - MODEL_EMBEDDING_MODEL=BGE-M3
      - MODEL_EMBEDDING_DIMENSIONS=1024
      - MODEL_LLM_MODEL=gpt-4o-mini
      - MODEL_LLM_TEMPERATURE=0.1
      - MODEL_LLM_MAX_TOKENS=4096
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=resume_chunks
      - QDRANT_DISTANCE_METRIC=cosine
      - QDRANT_BATCH_SIZE=100
      - QDRANT_TIMEOUT=30.0
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY:-}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY:-}
      - INNGEST_BASE_URL=http://inngest:8288
      - INNGEST_DEV_MODE=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - EMBEDDING_DIMENSIONS=1024
      - EMBEDDING_BATCH_SIZE=32
      - EMBEDDING_MAX_RETRIES=3
      - EMBEDDING_TIMEOUT=60.0
      - RERANKER_PROVIDER=local
      - RERANKER_MODEL_NAME=BAAI/bge-reranker-v2-m3
      - RERANKER_TOP_K=20
      - RERANKER_MAX_RETRIES=3
      - RERANKER_TIMEOUT=60.0
      - SCORING_SKILL_WEIGHT=0.40
      - SCORING_EXPERIENCE_WEIGHT=0.20
      - SCORING_EDUCATION_WEIGHT=0.10
      - SCORING_SEMANTIC_WEIGHT=0.30
      - SCORING_MIN_SKILL_MATCH_THRESHOLD=0.3
      - SCORING_PROMPT_VERSION=1.0
      - SCORING_SCORING_VERSION=1.0
      - CHUNKING_CHUNK_SIZE=1000
      - CHUNKING_CHUNK_OVERLAP=200
      - CHUNKING_MIN_CHUNK_SIZE=100
      - SPRING_BOOT_BASE_URL=http://host.docker.internal:8080
      - SPRING_BOOT_API_KEY=${SPRING_BOOT_API_KEY:-}
      - SPRING_BOOT_TIMEOUT=30.0
    depends_on:
      qdrant:
        condition: service_healthy
      inngest:
        condition: service_started
    networks:
      - ai-service-network
    volumes:
      - ./data:/app/data

volumes:
  qdrant_data:
  inngest_data:

networks:
  ai-service-network:
    driver: bridge