[project]
name = "ai-service"
version = "0.1.0"
description = "AI-powered recruitment microservice for resume processing, candidate scoring, and ranking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "inngest>=0.5.19,<0.6.0",
    "qdrant-client>=1.10.0",
    "llama-index>=0.10.0",
    "llama-index-readers-file>=0.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",
    "numpy>=1.26.0",
    "email-validator>=2.1.0",
    "pypdf>=4.0.0",
    # Resume pipeline: PDF (PyMuPDF), DOCX, and OCR for scanned PDFs (needs the tesseract binary)
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# In-process BGE-M3 embeddings and the cross-encoder reranker (EMBEDDING_PROVIDER=local, RERANKER_PROVIDER=local).
# About 4 GB with torch. The default deployment uses Ollama (EMBEDDING_PROVIDER=ollama) and does not need this.
local-embeddings = [
    "FlagEmbedding>=1.2.10",
    "torch>=2.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "faker>=20.1.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true