# Serves the built app and proxies /api to the backend, so the browser only ever talks to this one origin
# (no CORS, and the auth cookie stays first-party). The backend itself is not published to the host.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A bulk upload is one request of up to ~600 MB; keep these in step with pipeline.upload.max-batch-size.
    client_max_body_size 700m;
    client_body_timeout 300s;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off; # stream large uploads to the backend instead of spooling them in nginx
    }

    # Hashed build assets can be cached for a long time; the HTML shell must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
